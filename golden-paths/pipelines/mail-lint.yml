# Mail Design Lint
# Copy this to .github/workflows/mail-lint.yml in your project.
#
# Purpose: run the deterministic email-template linter on every PR that touches
# a template, so a mail that breaks in Outlook, fails a contrast floor, names a
# brand face with no fallback, or still carries a PHOTO_URL placeholder cannot
# reach a patient.
#
# ## Why this is a CI job and not a PreToolUse merge hook
#
# The obvious shape for "lint gates the merge" in this framework is a hook on
# `gh pr merge`, alongside block-unreviewed-merge.sh and friends. That is the
# wrong tool here, for three reasons:
#
#   1. A PreToolUse hook only fires when the merge goes through Claude Code. A
#      human pressing Merge in the GitHub UI bypasses it completely. For a
#      *review* marker that is acceptable, because the marker is the record of
#      a judgement a person made. For a *lint*, it means the gate is absent
#      exactly when no agent is watching.
#   2. A merge-time hook would have to re-fetch every changed template from the
#      forge at PR HEAD to lint the right bytes — the local tree is usually not
#      the PR branch. That is a lot of fragile shell in the trust chain, and
#      AgDR-0104 is clear about what happens to hooks that grow complicated.
#   3. It adds a new file under .claude/hooks/ and a new matcher in
#      settings.json — both trust-chain surfaces that need a security pass —
#      to achieve something CI already does better.
#
# Run it in CI instead and the existing `block-merge-on-red-ci.sh` turns it
# into a merge gate for free: a red check blocks the merge through machinery
# that is already written, already tested, and already covers both merge
# shapes. Zero new trust-chain surface, and the author gets the finding on push
# rather than at merge.
#
# The judgement half (Barid, via /mail-review) stays advisory and out of CI by
# design — see .claude/agents/mail-reviewer.md § "Why you do not gate".

name: Mail Design Lint

on:
  pull_request:
    paths:
      # Keep in sync with mail_design.template_globs in your project config.
      - 'emails/**/*.html'
      - '**/email-templates/**/*.html'
      - '.claude/project-config.json'
      - '.claude/hooks/_lib-mail-lint.py'

permissions:
  contents: read

jobs:
  mail-lint:
    name: Lint email templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint templates
        run: |
          if [ ! -f .claude/hooks/_lib-mail-lint.py ]; then
            echo "::error::.claude/hooks/_lib-mail-lint.py is missing - is the apexyard .claude/ layer installed?"
            exit 1
          fi
          python3 .claude/hooks/_lib-mail-lint.py

      # The linter SKIPS any check whose brand config is empty, and says so on
      # stdout. A green check therefore does not mean "fully audited" - it means
      # "nothing that was checked failed". Surface the skip list in the job
      # summary so a reader of a green run can see what it did not cover.
      - name: Report unchecked rules
        if: always()
        run: |
          python3 .claude/hooks/_lib-mail-lint.py --json > /tmp/mail-lint.json 2>/dev/null || true
          skipped=$(python3 -c "
          import json,sys
          try: d=json.load(open('/tmp/mail-lint.json'))
          except Exception: sys.exit(0)
          for s in d.get('skipped', []): print('- ' + s)
          ")
          {
            echo "### Mail lint"
            if [ -n "$skipped" ]; then
              echo "These checks did **not** run, so this result says nothing about them:"
              echo "$skipped"
              echo ""
              echo "Configure them in \`.claude/project-config.json\` → \`mail_design\`."
            else
              echo "All configured checks ran."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
